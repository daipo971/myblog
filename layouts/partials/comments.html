{{- /* Comments area start - powered by self-hosted FastAPI on Botkeep */ -}}
{{- if (not .Params.hideComments) }}
<div class="comment-section">
    <h2 id="comments">💬 评论区</h2>
    <div id="comment-list" class="comment-list">
        <p class="comment-loading">评论加载中……</p>
    </div>

    <h3 class="comment-form-title">发表评论</h3>
    <form id="comment-form" class="comment-form" onsubmit="return submitComment(event)">
        <div class="comment-field">
            <label for="comment-name">昵称 *</label>
            <input type="text" id="comment-name" name="name" required maxlength="50" placeholder="你的名字或昵称">
        </div>
        <div class="comment-field">
            <label for="comment-email">邮箱（不公开，仅用于回复通知）</label>
            <input type="email" id="comment-email" name="email" maxlength="100" placeholder="可选">
        </div>
        <div class="comment-field">
            <label for="comment-content">评论内容 *</label>
            <textarea id="comment-content" name="content" rows="5" required maxlength="2000" placeholder="写下你的想法……"></textarea>
        </div>
        <!-- 蜜罐：正常用户看不到，机器人会填 -->
        <input type="text" id="comment-website" name="website" style="display:none" tabindex="-1" autocomplete="off">
        <div class="comment-actions">
            <button type="submit" class="comment-submit" id="comment-submit-btn">
                <span>发表评论</span>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
        <div id="comment-status" class="comment-status hidden"></div>
    </form>
</div>

<style>
.comment-section {
    margin-top: 40px;
    padding-top: 30px;
    border-top: 1px solid rgba(0, 210, 255, 0.15);
}

.comment-section h2 {
    font-size: 22px;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 8px;
}

.comment-list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    margin-bottom: 28px;
}

.comment-loading, .comment-empty {
    color: var(--secondary);
    font-size: 14px;
}

.comment-item {
    background: rgba(17, 17, 24, 0.6);
    border: 1px solid rgba(0, 210, 255, 0.12);
    border-radius: 8px;
    padding: 12px 16px;
}

.comment-meta {
    display: flex;
    gap: 10px;
    align-items: baseline;
    margin-bottom: 6px;
}

.comment-name {
    font-weight: 600;
    color: #00d2ff;
    font-size: 14px;
}

.comment-time {
    font-size: 12px;
    color: var(--secondary);
}

.comment-body {
    font-size: 15px;
    line-height: 1.7;
    color: var(--primary);
    white-space: pre-wrap;
    word-break: break-word;
}

.comment-form-title {
    font-size: 18px;
    font-weight: 600;
    color: var(--primary);
    margin-bottom: 16px;
}

.comment-form {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.comment-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.comment-field label {
    font-size: 14px;
    font-weight: 500;
    color: var(--secondary);
}

.comment-field input,
.comment-field textarea {
    background: rgba(17, 17, 24, 0.8);
    border: 1px solid rgba(0, 210, 255, 0.15);
    border-radius: 8px;
    padding: 10px 14px;
    color: var(--primary);
    font-family: inherit;
    font-size: 15px;
    transition: border-color 0.3s ease, box-shadow 0.3s ease;
    outline: none;
}

.comment-field input:focus,
.comment-field textarea:focus {
    border-color: #00d2ff;
    box-shadow: 0 0 12px rgba(0, 210, 255, 0.15);
}

.comment-field textarea {
    resize: vertical;
    min-height: 100px;
}

.comment-actions {
    display: flex;
    align-items: center;
    gap: 12px;
}

.comment-submit {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 24px;
    background: linear-gradient(135deg, rgba(0, 210, 255, 0.15) 0%, rgba(0, 255, 102, 0.1) 100%);
    border: 1px solid rgba(0, 210, 255, 0.25);
    border-radius: 8px;
    color: #00d2ff;
    font-size: 15px;
    font-weight: 500;
    font-family: inherit;
    cursor: pointer;
    transition: all 0.3s ease;
}

.comment-submit:hover:not(:disabled) {
    background: linear-gradient(135deg, rgba(0, 210, 255, 0.25) 0%, rgba(0, 255, 102, 0.2) 100%);
    box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
    transform: translateY(-1px);
}

.comment-submit:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.comment-status {
    padding: 10px 14px;
    border-radius: 8px;
    font-size: 14px;
}

.comment-status.success {
    background: rgba(0, 255, 102, 0.1);
    border: 1px solid rgba(0, 210, 255, 0.2);
    color: #00ff66;
}

.comment-status.error {
    background: rgba(255, 68, 102, 0.1);
    border: 1px solid rgba(255, 68, 102, 0.2);
    color: #ff4466;
}

.comment-status.hidden {
    display: none;
}
</style>

<script>
(function() {
    var COMMENT_API = "{{ .Site.Params.commentAPI }}".replace(/\/+$/, "");
    var POST_SLUG = window.location.pathname.replace(/\/+$/, "") || "/";

    function esc(s) {
        return String(s).replace(/[&<>"']/g, function(m) {
            return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[m];
        });
    }

    function formatTime(iso) {
        try {
            var d = new Date(iso);
            return d.toLocaleString("zh-CN", {hour12: false});
        } catch (e) { return ""; }
    }

    function setStatus(msg, ok) {
        var st = document.getElementById("comment-status");
        st.className = "comment-status " + (ok ? "success" : "error");
        st.textContent = msg;
    }

    async function loadComments() {
        var list = document.getElementById("comment-list");
        if (!COMMENT_API) {
            list.innerHTML = '<p class="comment-empty">评论功能配置中，稍后再来看看。</p>';
            return;
        }
        try {
            var r = await fetch(COMMENT_API + "/api/comments?post=" + encodeURIComponent(POST_SLUG));
            if (!r.ok) throw new Error("http " + r.status);
            var data = await r.json();
            renderComments(data.comments || []);
        } catch (e) {
            list.innerHTML = '<p class="comment-empty">评论加载失败，请稍后刷新重试。</p>';
        }
    }

    function renderComments(comments) {
        var list = document.getElementById("comment-list");
        if (!comments.length) {
            list.innerHTML = '<p class="comment-empty">还没有评论，来抢沙发吧 👇</p>';
            return;
        }
        list.innerHTML = comments.map(function(c) {
            return '<div class="comment-item">' +
                '<div class="comment-meta"><span class="comment-name">' + esc(c.name) + '</span>' +
                '<span class="comment-time">' + esc(formatTime(c.created_at)) + '</span></div>' +
                '<div class="comment-body">' + esc(c.content) + '</div></div>';
        }).join("");
    }

    window.submitComment = async function(e) {
        e.preventDefault();
        var name = document.getElementById("comment-name").value.trim();
        var email = document.getElementById("comment-email").value.trim();
        var content = document.getElementById("comment-content").value.trim();
        var website = document.getElementById("comment-website").value;
        var btn = document.getElementById("comment-submit-btn");
        if (!name || !content) return false;
        if (!COMMENT_API) { setStatus("评论服务暂未配置", false); return false; }
        btn.disabled = true;
        try {
            var r = await fetch(COMMENT_API + "/api/comments", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({post_slug: POST_SLUG, name: name, email: email, content: content, website: website})
            });
            var data = await r.json();
            if (!r.ok) throw new Error(data.detail || ("http " + r.status));
            setStatus("✅ " + (data.message || "评论发表成功"), true);
            document.getElementById("comment-name").value = "";
            document.getElementById("comment-email").value = "";
            document.getElementById("comment-content").value = "";
            loadComments();
        } catch (err) {
            setStatus("❌ 提交失败：" + err.message, false);
        } finally {
            btn.disabled = false;
        }
        return false;
    };

    loadComments();
})();
</script>
{{- end }}
{{- /* Comments area end */ -}}
