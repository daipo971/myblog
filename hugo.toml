baseURL = "https://xinqai.com"
theme = "PaperMod"
defaultContentLanguage = "zh-cn"
# 中文保持在根目录（原有网址不变），英文在 /en/
defaultContentLanguageInSubdir = false
enableRobotsTXT = true

[params]
  defaultTheme = "light"
  disableThemeToggle = false
  env = "production"
  showPostNavLinks = true
  ShowBreadCrumbs = true
  # 顶部语言切换显示「English / 中文」而不是「En / Zh-Cn」
  displayFullLangName = true
  # 默认分享图（og:image / twitter:image），文章可用 images: [...] 覆盖
  images = ["assets/og-image.png"]

  # 评论后端 API（Botkeep 自托管 FastAPI）
  commentAPI = "https://wsxw4z.bot-keep.xyz"

  # SEO（站长验证）
  [params.analytics.google]
    SiteVerificationTag = "googlee78fbd130bd563d5"
  [params.analytics.bing]
    SiteVerificationTag = "F7ED783B3CF5AA4252FD5454135D5D82"

  # 文章默认配置
  [params.assets]
    disableFingerprinting = false

  [params.fuseOpts]
    isCaseSensitive = false
    shouldSort = true
    location = 0
    distance = 1000
    threshold = 0.4
    minMatchCharLength = 0
    keys = ["title", "permalink", "summary", "content"]

  [params.schema]
    publisherType = "Organization"
    sameAs = ["https://t.me/xinqiaigongju"]

[languages]
  [languages.zh-cn]
    weight = 1
    languageCode = "zh-CN"
    languageName = "中文"
    languageAltTitle = "中文"
    title = "欣淇AI网 - AI工具教程与免费资源"
    [languages.zh-cn.params]
      # 文章页标题后缀用短名：「文章标题 | 欣淇AI网」
      shortTitle = "欣淇AI网"
      hreflang = "zh"
      author = "欣淇"
      description = "欣淇AI网：AI 工具评测、免费资源与实战教程。ChatGPT、Claude、DeepSeek、Kimi 等国内外大模型的上手指南与最新动态。"
      keywords = ["AI工具", "AI教程", "ChatGPT", "Claude", "DeepSeek", "Kimi", "免费AI", "大模型"]
      # 日期显示格式（中文）：2026年10月15日
      DateFormat = "2006年1月2日"
      [languages.zh-cn.params.label]
        text = "欣淇AI网"
        icon = "/images/logo-96.webp"
        iconHeight = 35
      [languages.zh-cn.params.homeInfoParams]
        title = "欣淇AI网"
        content = "探索人工智能的无限可能。分享 AI 工具评测、免费资源教程与实战技巧。\n\n🎯 **AI 工具评测** · 💰 **免费资源** · 🔧 **实战教程**"
      [languages.zh-cn.params.footer]
        hideCopyright = false
        text = "探索 · 创新 · 赚钱"
      [languages.zh-cn.params.contact]
        email = "daipo971@outlook.com"
        label = "联系我："

  [[languages.zh-cn.menus.main]]
    identifier = "home"
    name = "首页"
    url = "/"
    weight = 10

  [[languages.zh-cn.menus.main]]
    identifier = "posts"
    name = "文章"
    url = "/posts/"
    weight = 20

  [[languages.zh-cn.menus.main]]
    identifier = "categories"
    name = "分类"
    url = "/categories/"
    weight = 22

  [[languages.zh-cn.menus.main]]
    identifier = "tools"
    name = "推荐工具"
    url = "/tools/"
    weight = 25

  [[languages.zh-cn.menus.main]]
    identifier = "archives"
    name = "归档"
    url = "/archives/"
    weight = 30

  [[languages.zh-cn.menus.main]]
    identifier = "links"
    name = "友情链接"
    url = "/links/"
    weight = 35

  [[languages.zh-cn.menus.main]]
    identifier = "search"
    name = "搜索"
    url = "/search/"
    weight = 40

  [[languages.zh-cn.menus.main]]
    identifier = "about"
    name = "关于"
    url = "/about/"
    weight = 99

  [languages.en]
    weight = 2
    languageCode = "en-US"
    languageName = "English"
    languageAltTitle = "English"
    title = "XinqAI - AI Tools, Guides & China AI News"
    [languages.en.params]
      shortTitle = "XinqAI"
      hreflang = "en"
      author = "Xinqi"
      description = "XinqAI: hands-on AI tool guides and news, with a focus on Chinese AI models such as DeepSeek, Kimi, MiniMax and Qwen, explained in plain English."
      keywords = ["AI tools", "Chinese AI models", "DeepSeek", "Kimi", "MiniMax", "LLM API", "AI guides"]
      DateFormat = "January 2, 2006"
      [languages.en.params.label]
        text = "XinqAI"
        icon = "/images/logo-96.webp"
        iconHeight = 35
      [languages.en.params.homeInfoParams]
        title = "XinqAI"
        content = "Practical guides to AI tools, with a focus on what is happening in China's AI scene: DeepSeek, Kimi, MiniMax, Qwen and more, explained in plain English.\n\n🎯 **Model guides** · 💰 **Pricing & free tiers** · 🔧 **How-tos**"
      [languages.en.params.footer]
        hideCopyright = false
        text = "Explore · Build · Ship"
      [languages.en.params.contact]
        email = "daipo971@outlook.com"
        label = "Contact:"
    [[languages.en.menus.main]]
      identifier = "home"
      name = "Home"
      url = "/en/"
      weight = 10
    [[languages.en.menus.main]]
      identifier = "posts"
      name = "Posts"
      url = "/en/posts/"
      weight = 20
    [[languages.en.menus.main]]
      identifier = "archives"
      name = "Archives"
      url = "/en/archives/"
      weight = 30
    [[languages.en.menus.main]]
      identifier = "search"
      name = "Search"
      url = "/en/search/"
      weight = 40
    [[languages.en.menus.main]]
      identifier = "about"
      name = "About"
      url = "/en/about/"
      weight = 99

[outputs]
  home = ["HTML", "RSS", "JSON"]

[sitemap]
  changeFreq = "weekly"
  filename = "sitemap.xml"
